on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

name: Reproduce publication outputs

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      METHODSX_MODE: publication
      METHODSX_REUSE_INTERMEDIATE: "0"
      METHODSX_RENDER_RMD: "1"
      METHODSX_SKIP_SIMULATION: "0"
      METHODSX_CUT_RESTARTS: "200"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.0"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
      - name: Run complete publication pipeline
        shell: Rscript {0}
        run: source("run_all.R")
      - name: Check release products
        shell: Rscript {0}
        run: source("scripts/release_check.R")
      - name: Upload reproducibility products
        uses: actions/upload-artifact@v4
        with:
          name: methodsx-mobility-publication
          path: |
            output/MethodsX_MOB.docx
            output/Cover_Letter_MethodsX.docx
            output/MethodsX_MOB_figures.html
            output/figures/
            output/diagnostics/
